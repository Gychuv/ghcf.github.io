<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Cloudflare Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            min-height: 100vh;
            font-family: "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .card {
            position: absolute;
            z-index: 10;
            background: #161b22;
            padding: 60px 50px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(88, 166, 255, 0.25);
            text-align: center;
            border: 1px solid #30363d;
            max-width: 90%;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .card.dragging {
            cursor: grabbing;
        }

        h1 {
            color: #58a6ff;
            font-size: 36px;
            margin-bottom: 12px;
            min-height: 1.2em;
        }

        .subname {
            color: #89cff0;
            font-size: 26px;
            margin-bottom: 20px;
            min-height: 1.2em;
        }

        p {
            color: #c9d1d9;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .music-btn {
            background: transparent;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 10px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.25s;
        }

        .music-btn:hover {
            background: #58a6ff;
            color: #0d1117;
            border-color: #58a6ff;
        }
    </style>
</head>
<body>

<canvas id="particles-canvas"></canvas>

<div class="card" id="card">
    <h1 id="title"></h1>
    <div class="subname" id="subname"></div>
    <p>🌑暗黑粒子 · DNA波动 · 拖拽卡片</p>
    <button class="music-btn" id="musicBtn">🔇 开启背景音乐</button>
</div>

<script>
    // ========== 画布与尺寸 ==========
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let w = 0, h = 0;
    let particles = [];

    const particleCount = 160;
    const connectDistance = 110;

    let mouse = { x: null, y: null, radius: 170, strength: 0.5 };

    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    window.addEventListener('mouseout', () => {
        mouse.x = null;
        mouse.y = null;
    });

    // ========== DNA粒子 ==========
    class Particle {
        constructor(index) {
            this.index = index;
            this.reset();
        }

        reset() {
            this.x = Math.random() * w;
            this.y = Math.random() * h;
            this.phase = Math.random() * Math.PI * 2;
            this.baseY = this.y;
            this.r = Math.random() * 1.3 + 0.4;
            this.speed = 0.008 + Math.random() * 0.012;
            this.type = Math.random() < 0.5 ? 0 : 1;
        }

        update() {
            this.phase += this.speed;
            const wave = Math.sin(this.phase) * 50;
            this.y = this.baseY + wave;

            this.x += Math.sin(this.phase * 0.7) * 0.15;
            this.y += Math.cos(this.phase * 0.5) * 0.1;

            if (mouse.x !== null && mouse.y !== null) {
                let dx = this.x - mouse.x;
                let dy = this.y - mouse.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < mouse.radius && dist > 0) {
                    this.x += (dx / dist) * mouse.strength;
                    this.y += (dy / dist) * mouse.strength;
                }
            }

            if (this.x < -30) this.x = w + 30;
            if (this.x > w + 30) this.x = -30;
            if (this.y < -30) this.y = h + 30;
            if (this.y > h + 30) this.y = -30;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            if (this.type === 0) {
                ctx.fillStyle = "rgba(88,166,255,0.75)";
            } else {
                ctx.fillStyle = "rgba(80,220,220,0.75)";
            }
            ctx.fill();
        }
    }

    function createParticles() {
        particles = [];
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle(i));
        }
    }

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        createParticles();
    }

    window.addEventListener('resize', resize);

    // ========== 连线 ==========
    function drawLines() {
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                let dx = particles[i].x - particles[j].x;
                let dy = particles[i].y - particles[j].y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < connectDistance) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    let alpha = (1 - dist / connectDistance) * 0.35;
                    if (particles[i].type !== particles[j].type) {
                        ctx.strokeStyle = `rgba(180,180,255,${alpha * 0.6})`;
                    } else {
                        ctx.strokeStyle = `rgba(88,166,255,${alpha * 0.25})`;
                    }
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }
            }
        }
    }

    function loop() {
        ctx.clearRect(0, 0, w, h);
        drawLines();
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(loop);
    }

    window.addEventListener("load", () => {
        resize();
        loop();
        setTimeout(() => {
            const card = document.getElementById('card');
            const rect = card.getBoundingClientRect();
            card.style.left = (window.innerWidth / 2 - rect.width / 2) + "px";
            card.style.top = (window.innerHeight / 2 - rect.height / 2) + "px";
        }, 150);
    });

    // ========== 拖拽：鼠标 + 触屏 ==========
    const card = document.getElementById('card');
    let isDragging = false;
    let dx = 0;
    let dy = 0;

    function startDrag(px, py) {
        isDragging = true;
        card.classList.add('dragging');
        dx = px - card.offsetLeft;
        dy = py - card.offsetTop;
    }

    function moveDrag(px, py) {
        if (!isDragging) return;
        card.style.left = (px - dx) + "px";
        card.style.top = (py - dy) + "px";
    }

    function endDrag() {
        isDragging = false;
        card.classList.remove('dragging');
    }

    card.addEventListener('mousedown', e => {
        startDrag(e.clientX, e.clientY);
        e.preventDefault();
    });

    window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    card.addEventListener('touchstart', e => {
        const t = e.touches[0];
        startDrag(t.clientX, t.clientY);
        e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchmove', e => {
        if (!isDragging) return;
        const t = e.touches[0];
        moveDrag(t.clientX, t.clientY);
        e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', endDrag);

    document.getElementById('musicBtn').addEventListener('mousedown', e => e.stopPropagation());
    document.getElementById('musicBtn').addEventListener('touchstart', e => e.stopPropagation());

    // ========== 打字机效果：Hello GitHub Pages! 打完再打 Gychuv ==========
    const title = document.getElementById('title');
    const subname = document.getElementById('subname');

    const firstText = "Hello Cloudflare Pages!";
    const secondText = "Gychuv";
    const typeSpeed = 180;

    let firstIndex = 0;
    let secondIndex = 0;

    function typeFirst() {
        if (firstIndex < firstText.length) {
            title.innerHTML += firstText.charAt(firstIndex);
            firstIndex++;
            setTimeout(typeFirst, typeSpeed);
        } else {
            // 第一行打完，停顿一下再开始第二行
            setTimeout(typeSecond, 350);
        }
    }

    function typeSecond() {
        if (secondIndex < secondText.length) {
            subname.innerHTML += secondText.charAt(secondIndex);
            secondIndex++;
            setTimeout(typeSecond, typeSpeed);
        }
    }

    window.addEventListener('load', () => {
        setTimeout(typeFirst, 500);
    });

    // ========== 背景音乐 ==========
    const musicBtn = document.getElementById('musicBtn');
    let musicOn = false;

    const audio = new Audio("https://cdn.pixabay.com/audio/2022/10/30/audio_767f6b1bcb.mp3");
    audio.loop = true;
    audio.volume = 0.5;

    musicBtn.addEventListener('click', () => {
        if (!musicOn) {
            audio.play().then(() => {
                musicOn = true;
                musicBtn.textContent = "🔊 关闭背景音乐";
            }).catch(err => {
                alert("浏览器阻止了自动播放，请确认点击后允许音频。");
                console.error(err);
            });
        } else {
            audio.pause();
            musicOn = false;
            musicBtn.textContent = "🔇 开启背景音乐";
        }
    });
</script>

</body>
</html>
